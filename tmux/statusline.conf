set -g mode-style "fg=#cdd6f4,bg=#313244"
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#cdd6f4,bg=#181825"
set -g status-bg "#181825"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style "NONE"
set -g status-right-style "NONE"

set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#181825,bold]"

set -g status-right "#[fg=#cba6f7,bg=#181825,nobold,nounderscore,noitalics]#[fg=#1e1e2e,bg=#cba6f7,bold] #(whoami) #[fg=#181825,bg=#cba6f7]"

setw -g window-status-activity-style "underscore,fg=#cba6f7,bg=#181825"
setw -g window-status-separator ""

setw -g window-status-activity-style "underscore,fg=#cba6f7,bg=#181825"

setw -g window-status-format '#[fg=#6c7086,bg=#181825] #I #[fg=#cdd6f4,bg=#181825]#{b:pane_current_path}  '

setw -g window-status-current-format '#[fg=#181825,bg=#cba6f7]#[fg=#181825,bg=#cba6f7,bold] #I  #{b:pane_current_path} #[fg=#cba6f7,bg=#181825,nobold]'
